version: '3.8'

services:

  # ─────────────────────────────────────────────
  # Ollama — Local LLM runtime
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Ollama Init — Pulls the mistral model once
  # ─────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull mistral"]
    restart: "no"

  # ─────────────────────────────────────────────
  # AI Assistant — Spring Boot backend
  # ─────────────────────────────────────────────
  ai-assistant:
    build:
      context: ./ai-assistant-backend
      dockerfile: Dockerfile
    container_name: ai-assistant
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  ollama_data:
    name: ollama_models
